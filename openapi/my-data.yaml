openapi: 3.0.0
info:
  title: マイデータ
  version: 1.0.0

paths:
  /my-data:
    # マイデータ取得
    get:
      operationId: getMyData
      summary: マイデータ取得
      responses:
        "200":
          description: マイデータ取得成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyData"

    # マイデータ更新
    put:
      operationId: putMyData
      summary: マイデータ更新
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                phone:
                  type: string
                email:
                  type: string
              required: ["name", "email"]
      responses:
        "200":
          description: マイデータ更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyData"

  /my-data/password:
    # パスワード更新
    put:
      operationId: putMyDataPassword
      summary: パスワード更新
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                newPassword:
                  type: string
              required: ["password", "newPassword"]
      responses:
        "200":
          description: パスワード更新
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required: ["message"]

components:
  schemas:
    MyData:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        department:
          type: string
        jobTitle:
          type: string
        phone:
          type: string
        email:
          type: string
        joinedOn:
          type: string
          format: date
        roles:
          type: array
          items:
            type: string
            enum: ["user", "admin"]
      required:
        [
          "id",
          "name",
          "department",
          "jobTitle",
          "phone",
          "email",
          "joinedOn",
          "roles",
        ]
