<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>マイページ — StaffBoard</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --ink: #1a1a1a; --ink-2: #555; --ink-3: #999;
  --surface: #f7f6f3; --white: #fff;
  --accent: #2d5be3; --accent-light: #eef1fd;
  --border: #e2e0da; --radius: 10px;
  --font: 'DM Sans', sans-serif; --mono: 'DM Mono', monospace;
  --sidebar: 220px;
}
body { font-family: var(--font); background: var(--surface); color: var(--ink); min-height: 100vh; display: flex; }

/* Sidebar */
.sidebar {
  width: var(--sidebar); min-height: 100vh;
  background: var(--white);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  position: fixed; top: 0; left: 0; bottom: 0;
  z-index: 10;
}
.sidebar-logo {
  padding: 24px 20px 20px;
  display: flex; align-items: center; gap: 10px;
  border-bottom: 1px solid var(--border);
}
.logo-icon {
  width: 30px; height: 30px; background: var(--accent);
  border-radius: 7px; display: flex; align-items: center; justify-content: center;
}
.logo-icon svg { width: 15px; height: 15px; }
.logo-text { font-size: 16px; font-weight: 500; letter-spacing: -0.02em; }

.nav { padding: 16px 12px; flex: 1; }
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 10px; border-radius: 8px;
  font-size: 14px; color: var(--ink-2);
  cursor: pointer; margin-bottom: 2px;
  text-decoration: none;
  transition: background 0.12s, color 0.12s;
}
.nav-item:hover { background: var(--surface); color: var(--ink); }
.nav-item.active { background: var(--accent-light); color: var(--accent); font-weight: 500; }
.nav-item svg { width: 16px; height: 16px; flex-shrink: 0; }

.sidebar-footer {
  padding: 16px 12px;
  border-top: 1px solid var(--border);
}
.user-row {
  display: flex; align-items: center; gap: 10px; padding: 8px 10px;
  border-radius: 8px; cursor: pointer;
  transition: background 0.12s;
}
.user-row:hover { background: var(--surface); }
.avatar {
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--accent-light);
  color: var(--accent); font-weight: 500; font-size: 13px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.user-name { font-size: 13px; font-weight: 500; }
.user-role { font-size: 11px; color: var(--ink-3); }
.logout-btn {
  width: 100%; margin-top: 8px; padding: 8px;
  font-family: var(--font); font-size: 13px;
  color: var(--ink-2); background: none;
  border: 1px solid var(--border); border-radius: 8px;
  cursor: pointer; transition: background 0.12s;
}
.logout-btn:hover { background: var(--surface); }

/* Main */
.main { margin-left: var(--sidebar); flex: 1; padding: 36px 40px; max-width: 860px; }
.page-header { margin-bottom: 28px; }
.page-title { font-size: 24px; font-weight: 500; letter-spacing: -0.02em; margin-bottom: 4px; }
.page-sub { font-size: 14px; color: var(--ink-2); }

.card {
  background: var(--white); border: 1px solid var(--border);
  border-radius: 14px; margin-bottom: 20px;
  overflow: hidden;
}
.card-header {
  padding: 18px 24px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.card-header-title { font-size: 15px; font-weight: 500; }
.card-body { padding: 24px; }

.profile-top {
  display: flex; align-items: center; gap: 20px;
  margin-bottom: 28px;
}
.avatar-large {
  width: 64px; height: 64px; border-radius: 50%;
  background: var(--accent-light); color: var(--accent);
  font-weight: 500; font-size: 22px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.profile-name { font-size: 20px; font-weight: 500; letter-spacing: -0.01em; }
.profile-meta { font-size: 13px; color: var(--ink-2); margin-top: 2px; }
.badge {
  display: inline-block; padding: 2px 8px;
  border-radius: 4px; font-size: 11px; font-weight: 500;
  background: var(--accent-light); color: var(--accent);
  margin-left: 6px;
}

.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.field { }
.field.full { grid-column: 1 / -1; }
.field label {
  display: block; font-size: 12px; font-weight: 500;
  color: var(--ink-3); letter-spacing: 0.04em;
  text-transform: uppercase; margin-bottom: 6px;
}
.field input {
  width: 100%; padding: 10px 13px;
  font-family: var(--font); font-size: 14px; color: var(--ink);
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.field input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(45,91,227,0.1);
  background: var(--white);
}
.field input[readonly] {
  color: var(--ink-3); cursor: not-allowed;
}

.btn-row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 8px; }
.btn-primary {
  padding: 10px 22px; font-family: var(--font);
  font-size: 14px; font-weight: 500; color: #fff;
  background: var(--accent); border: none; border-radius: 8px;
  cursor: pointer; transition: background 0.15s;
}
.btn-primary:hover { background: #2449c4; }
.btn-ghost {
  padding: 10px 22px; font-family: var(--font);
  font-size: 14px; font-weight: 500; color: var(--ink-2);
  background: none; border: 1px solid var(--border); border-radius: 8px;
  cursor: pointer; transition: background 0.15s;
}
.btn-ghost:hover { background: var(--surface); }

.nav-hint {
  position: fixed; bottom: 16px; right: 24px;
  font-size: 11px; font-family: var(--mono);
  color: var(--ink-3);
}
.nav-hint a { color: var(--accent); text-decoration: none; margin: 0 6px; }
</style>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-logo">
    <div class="logo-icon">
      <svg viewBox="0 0 18 18" fill="none"><rect x="2" y="2" width="6" height="6" rx="1.5" fill="white"/><rect x="10" y="2" width="6" height="6" rx="1.5" fill="white" opacity="0.6"/><rect x="2" y="10" width="6" height="6" rx="1.5" fill="white" opacity="0.6"/><rect x="10" y="10" width="6" height="6" rx="1.5" fill="white" opacity="0.3"/></svg>
    </div>
    <span class="logo-text">StaffBoard</span>
  </div>

  <nav class="nav">
    <a href="02_mypage.html" class="nav-item active">
      <svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="5" r="3" stroke="currentColor" stroke-width="1.4"/><path d="M2 13c0-3.3 2.7-6 6-6s6 2.7 6 6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      マイページ
    </a>
    <a href="03_kintai.html" class="nav-item">
      <svg viewBox="0 0 16 16" fill="none"><rect x="2" y="3" width="12" height="11" rx="1.5" stroke="currentColor" stroke-width="1.4"/><path d="M5 1v4M11 1v4M2 7h12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      勤怠管理
    </a>
  </nav>

  <div class="sidebar-footer">
    <div class="user-row">
      <div class="avatar">山</div>
      <div>
        <div class="user-name">山田 太郎</div>
        <div class="user-role">一般社員</div>
      </div>
    </div>
    <button class="logout-btn">ログアウト</button>
  </div>
</aside>

<main class="main">
  <div class="page-header">
    <div class="page-title">マイページ</div>
    <div class="page-sub">プロフィール情報の確認・編集ができます</div>
  </div>

  <div class="card">
    <div class="card-header">
      <div class="card-header-title">プロフィール情報</div>
    </div>
    <div class="card-body">
      <div class="profile-top">
        <div class="avatar-large">山</div>
        <div>
          <div class="profile-name">山田 太郎<span class="badge">一般社員</span></div>
          <div class="profile-meta">エンジニアリング部 · シニアエンジニア · 入社日 2021/04/01</div>
        </div>
      </div>

      <div class="form-grid">
        <div class="field">
          <label>氏名</label>
          <input type="text" value="山田 太郎">
        </div>
        <div class="field">
          <label>入社日</label>
          <input type="text" value="2021/04/01" readonly>
        </div>
        <div class="field">
          <label>部署</label>
          <input type="text" value="エンジニアリング部">
        </div>
        <div class="field">
          <label>役職</label>
          <input type="text" value="シニアエンジニア">
        </div>
        <div class="field">
          <label>メールアドレス</label>
          <input type="email" value="yamada@example.com">
        </div>
        <div class="field">
          <label>電話番号</label>
          <input type="tel" value="090-1234-5678">
        </div>
      </div>

      <div class="btn-row">
        <button class="btn-ghost">キャンセル</button>
        <button class="btn-primary">変更を保存</button>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <div class="card-header-title">パスワード変更</div>
    </div>
    <div class="card-body">
      <div class="form-grid">
        <div class="field">
          <label>現在のパスワード</label>
          <input type="password" placeholder="••••••••">
        </div>
        <div class="field"></div>
        <div class="field">
          <label>新しいパスワード</label>
          <input type="password" placeholder="••••••••">
        </div>
        <div class="field">
          <label>新しいパスワード（確認）</label>
          <input type="password" placeholder="••••••••">
        </div>
      </div>
      <div class="btn-row">
        <button class="btn-primary">パスワードを変更</button>
      </div>
    </div>
  </div>
</main>

<div class="nav-hint">

</html>
