<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>勤怠管理 — StaffBoard</title>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --ink: #1a1a1a;
        --ink-2: #555;
        --ink-3: #999;
        --surface: #f7f6f3;
        --white: #fff;
        --accent: #2d5be3;
        --accent-light: #eef1fd;
        --border: #e2e0da;
        --radius: 10px;
        --font: "DM Sans", sans-serif;
        --mono: "DM Mono", monospace;
        --sidebar: 220px;
        --green: #16a34a;
        --green-light: #dcfce7;
      }
      body {
        font-family: var(--font);
        background: var(--surface);
        color: var(--ink);
        min-height: 100vh;
        display: flex;
      }

      .sidebar {
        width: var(--sidebar);
        min-height: 100vh;
        background: var(--white);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        z-index: 10;
      }
      .sidebar-logo {
        padding: 24px 20px 20px;
        display: flex;
        align-items: center;
        gap: 10px;
        border-bottom: 1px solid var(--border);
      }
      .logo-icon {
        width: 30px;
        height: 30px;
        background: var(--accent);
        border-radius: 7px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .logo-icon svg {
        width: 15px;
        height: 15px;
      }
      .logo-text {
        font-size: 16px;
        font-weight: 500;
        letter-spacing: -0.02em;
      }

      .nav {
        padding: 16px 12px;
        flex: 1;
      }
      .nav-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 10px;
        border-radius: 8px;
        font-size: 14px;
        color: var(--ink-2);
        cursor: pointer;
        margin-bottom: 2px;
        text-decoration: none;
        transition:
          background 0.12s,
          color 0.12s;
      }
      .nav-item:hover {
        background: var(--surface);
        color: var(--ink);
      }
      .nav-item.active {
        background: var(--accent-light);
        color: var(--accent);
        font-weight: 500;
      }
      .nav-item svg {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
      }

      .sidebar-footer {
        padding: 16px 12px;
        border-top: 1px solid var(--border);
      }
      .user-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 10px;
        border-radius: 8px;
        cursor: pointer;
        transition: background 0.12s;
      }
      .user-row:hover {
        background: var(--surface);
      }
      .avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: var(--accent-light);
        color: var(--accent);
        font-weight: 500;
        font-size: 13px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .user-name {
        font-size: 13px;
        font-weight: 500;
      }
      .user-role {
        font-size: 11px;
        color: var(--ink-3);
      }
      .logout-btn {
        width: 100%;
        margin-top: 8px;
        padding: 8px;
        font-family: var(--font);
        font-size: 13px;
        color: var(--ink-2);
        background: none;
        border: 1px solid var(--border);
        border-radius: 8px;
        cursor: pointer;
        transition: background 0.12s;
      }
      .logout-btn:hover {
        background: var(--surface);
      }

      .main {
        margin-left: var(--sidebar);
        flex: 1;
        padding: 36px 40px;
      }
      .page-header {
        margin-bottom: 28px;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
      }
      .page-title {
        font-size: 24px;
        font-weight: 500;
        letter-spacing: -0.02em;
        margin-bottom: 4px;
      }
      .page-sub {
        font-size: 14px;
        color: var(--ink-2);
      }

      .month-nav {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .month-btn {
        width: 32px;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--white);
        cursor: pointer;
        transition: background 0.12s;
      }
      .month-btn:hover {
        background: var(--surface);
      }
      .month-label {
        font-size: 15px;
        font-weight: 500;
        min-width: 90px;
        text-align: center;
      }

      .summary-row {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
        margin-bottom: 20px;
      }
      .stat-card {
        background: var(--white);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 20px 22px;
      }
      .stat-label {
        font-size: 12px;
        color: var(--ink-3);
        letter-spacing: 0.04em;
        text-transform: uppercase;
        margin-bottom: 8px;
      }
      .stat-value {
        font-size: 28px;
        font-weight: 500;
        letter-spacing: -0.03em;
        font-family: var(--mono);
      }
      .stat-value span {
        font-size: 14px;
        color: var(--ink-2);
        margin-left: 2px;
      }
      .stat-sub {
        font-size: 12px;
        color: var(--ink-3);
        margin-top: 4px;
      }

      .card {
        background: var(--white);
        border: 1px solid var(--border);
        border-radius: 14px;
        overflow: hidden;
        margin-bottom: 20px;
      }
      .card-header {
        padding: 16px 24px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .card-header-title {
        font-size: 15px;
        font-weight: 500;
      }
      .btn-primary {
        padding: 8px 18px;
        font-family: var(--font);
        font-size: 13px;
        font-weight: 500;
        color: #fff;
        background: var(--accent);
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: background 0.15s;
      }
      .btn-primary:hover {
        background: #2449c4;
      }

      .table {
        width: 100%;
        border-collapse: collapse;
      }
      .table th {
        padding: 10px 16px;
        font-size: 11px;
        font-weight: 500;
        color: var(--ink-3);
        text-align: left;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        border-bottom: 1px solid var(--border);
      }
      .table td {
        padding: 12px 16px;
        font-size: 14px;
        border-bottom: 1px solid var(--border);
        vertical-align: middle;
      }
      .table tr:last-child td {
        border-bottom: none;
      }
      .table tr:hover td {
        background: var(--surface);
      }

      .time-input {
        width: 88px;
        padding: 6px 10px;
        font-family: var(--mono);
        font-size: 13px;
        color: var(--ink);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 6px;
        outline: none;
        transition: border-color 0.15s;
      }
      .time-input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 2px rgba(45, 91, 227, 0.1);
      }

      .hours-badge {
        display: inline-block;
        padding: 3px 10px;
        border-radius: 4px;
        font-family: var(--mono);
        font-size: 12px;
        font-weight: 500;
        background: var(--green-light);
        color: var(--green);
      }
      .hours-badge.empty {
        background: var(--surface);
        color: var(--ink-3);
      }

      .day-tag {
        font-size: 13px;
        color: var(--ink-2);
      }
      .day-tag.weekend {
        color: #c0392b;
      }
      .day-tag.today {
        font-weight: 500;
        color: var(--accent);
      }

      .save-cell {
        text-align: right;
      }
      .btn-save {
        padding: 5px 12px;
        font-family: var(--font);
        font-size: 12px;
        font-weight: 500;
        color: var(--accent);
        background: var(--accent-light);
        border: none;
        border-radius: 6px;
        cursor: pointer;
        transition: background 0.12s;
      }
      .btn-save:hover {
        background: #dce6fd;
      }

      .nav-hint {
        position: fixed;
        bottom: 16px;
        right: 24px;
        font-size: 11px;
        font-family: var(--mono);
        color: var(--ink-3);
      }
      .nav-hint a {
        color: var(--accent);
        text-decoration: none;
        margin: 0 6px;
      }
    </style>
  </head>
  <body>
    <aside class="sidebar">
      <div class="sidebar-logo">
        <div class="logo-icon">
          <svg viewBox="0 0 18 18" fill="none">
            <rect x="2" y="2" width="6" height="6" rx="1.5" fill="white" />
            <rect
              x="10"
              y="2"
              width="6"
              height="6"
              rx="1.5"
              fill="white"
              opacity="0.6"
            />
            <rect
              x="2"
              y="10"
              width="6"
              height="6"
              rx="1.5"
              fill="white"
              opacity="0.6"
            />
            <rect
              x="10"
              y="10"
              width="6"
              height="6"
              rx="1.5"
              fill="white"
              opacity="0.3"
            />
          </svg>
        </div>
        <span class="logo-text">StaffBoard</span>
      </div>
      <nav class="nav">
        <a href="02_mypage.html" class="nav-item">
          <svg viewBox="0 0 16 16" fill="none">
            <circle
              cx="8"
              cy="5"
              r="3"
              stroke="currentColor"
              stroke-width="1.4"
            />
            <path
              d="M2 13c0-3.3 2.7-6 6-6s6 2.7 6 6"
              stroke="currentColor"
              stroke-width="1.4"
              stroke-linecap="round"
            />
          </svg>
          マイページ
        </a>
        <a href="03_kintai.html" class="nav-item active">
          <svg viewBox="0 0 16 16" fill="none">
            <rect
              x="2"
              y="3"
              width="12"
              height="11"
              rx="1.5"
              stroke="currentColor"
              stroke-width="1.4"
            />
            <path
              d="M5 1v4M11 1v4M2 7h12"
              stroke="currentColor"
              stroke-width="1.4"
              stroke-linecap="round"
            />
          </svg>
          勤怠管理
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-row">
          <div class="avatar">山</div>
          <div>
            <div class="user-name">山田 太郎</div>
            <div class="user-role">一般社員</div>
          </div>
        </div>
        <button class="logout-btn">ログアウト</button>
      </div>
    </aside>

    <main class="main">
      <div class="page-header">
        <div>
          <div class="page-title">勤怠管理</div>
          <div class="page-sub">出勤・退勤時刻の入力と月次集計</div>
        </div>
        <div class="month-nav">
          <button class="month-btn">
            <svg viewBox="0 0 16 16" fill="none" width="14" height="14">
              <path
                d="M10 12L6 8l4-4"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
          <div class="month-label">2025年4月</div>
          <button class="month-btn">
            <svg viewBox="0 0 16 16" fill="none" width="14" height="14">
              <path
                d="M6 4l4 4-4 4"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </div>
      </div>

      <div class="summary-row">
        <div class="stat-card">
          <div class="stat-label">月合計時間</div>
          <div class="stat-value">142<span>h</span></div>
          <div class="stat-sub">稼働日 18日</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">平均勤務時間</div>
          <div class="stat-value">7.9<span>h/日</span></div>
          <div class="stat-sub">先月比 +0.3h</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">未入力日</div>
          <div class="stat-value">3<span>日</span></div>
          <div class="stat-sub">残り入力が必要です</div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <div class="card-header-title">日別勤怠記録</div>
        </div>
        <table class="table">
          <thead>
            <tr>
              <th>日付</th>
              <th>出勤</th>
              <th>退勤</th>
              <th>勤務時間</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td><span class="day-tag today">4/20 (月) 今日</span></td>
              <td><input class="time-input" type="time" value="09:00" /></td>
              <td><input class="time-input" type="time" value="" /></td>
              <td><span class="hours-badge empty">—</span></td>
              <td class="save-cell"><button class="btn-save">保存</button></td>
            </tr>
            <tr>
              <td><span class="day-tag">4/19 (日)</span></td>
              <td colspan="4" style="color: var(--ink-3); font-size: 13px">
                休日
              </td>
            </tr>
            <tr>
              <td><span class="day-tag weekend">4/18 (土)</span></td>
              <td colspan="4" style="color: var(--ink-3); font-size: 13px">
                休日
              </td>
            </tr>
            <tr>
              <td><span class="day-tag">4/17 (金)</span></td>
              <td><input class="time-input" type="time" value="09:15" /></td>
              <td><input class="time-input" type="time" value="18:30" /></td>
              <td><span class="hours-badge">8h 15m</span></td>
              <td class="save-cell"><button class="btn-save">保存</button></td>
            </tr>
            <tr>
              <td><span class="day-tag">4/16 (木)</span></td>
              <td><input class="time-input" type="time" value="09:00" /></td>
              <td><input class="time-input" type="time" value="18:00" /></td>
              <td><span class="hours-badge">9h 00m</span></td>
              <td class="save-cell"><button class="btn-save">保存</button></td>
            </tr>
            <tr>
              <td><span class="day-tag">4/15 (水)</span></td>
              <td><input class="time-input" type="time" value="09:30" /></td>
              <td><input class="time-input" type="time" value="19:00" /></td>
              <td><span class="hours-badge">9h 30m</span></td>
              <td class="save-cell"><button class="btn-save">保存</button></td>
            </tr>
            <tr>
              <td><span class="day-tag">4/14 (火)</span></td>
              <td><input class="time-input" type="time" value="09:00" /></td>
              <td><input class="time-input" type="time" value="17:30" /></td>
              <td><span class="hours-badge">8h 30m</span></td>
              <td class="save-cell"><button class="btn-save">保存</button></td>
            </tr>
            <tr>
              <td><span class="day-tag">4/13 (月)</span></td>
              <td><input class="time-input" type="time" value="09:00" /></td>
              <td><input class="time-input" type="time" value="18:00" /></td>
              <td><span class="hours-badge">9h 00m</span></td>
              <td class="save-cell"><button class="btn-save">保存</button></td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>

    <div class="nav-hint">
      <a href="01_login.html">ログイン</a>
      <a href="02_mypage.html">マイページ</a>
      <a href="03_kintai.html">勤怠</a>
      <a href="04_admin.html">管理者</a>
    </div>
  </body>
</html>
